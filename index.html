<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Submit grocery supply and product recall notices.">
  <title>HW1-Sharan Lourduraj</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>Grocery Supply and Recall Notices</h1>
      <p>Use this form to submit a grocery supply or product recall notice.</p>
    </header>

    <form id="noticeForm" novalidate>
      <h2>Submit a Notice</h2>

      <label for="productName">Product name *</label>
      <input
        type="text"
        id="productName"
        name="productName"
        placeholder="Enter the product name"
        autocomplete="off"
        autofocus
        required
      >

      <label for="brandName">Brand or supplier *</label>
      <input
        type="text"
        id="brandName"
        name="brandName"
        placeholder="Enter the brand or supplier"
        autocomplete="organization"
        required
      >

      <label for="submitterEmail">Submitter email *</label>
      <input
        type="email"
        id="submitterEmail"
        name="submitterEmail"
        placeholder="Enter your email address"
        autocomplete="email"
        required
      >

      <label for="category">Notice category *</label>
      <select id="category" name="category" required>
        <option value="" selected disabled>Select a category</option>
        <option value="food-safety-recall">Food Safety Recall</option>
        <option value="allergen-alert">Allergen Alert</option>
        <option value="quality-withdrawal">Quality Withdrawal</option>
        <option value="supply-shortage">Supply Shortage</option>
      </select>

      <label for="description">Notice description *</label>
      <textarea
        id="description"
        name="description"
        rows="5"
        minlength="26"
        placeholder="Describe the product issue and recommended action"
        required
      ></textarea>
      <p class="hint"><span id="characterCount">0</span> characters (minimum 26)</p>

      <div class="terms-row">
        <input type="checkbox" id="termsAccepted" name="termsAccepted" required>
        <label for="termsAccepted">I agree to the terms and conditions.</label>
      </div>

      <button type="submit">Submit Notice</button>
    </form>

    <div id="successMessage" class="success-message" role="status" aria-live="polite" hidden>
      <strong>Notice submitted successfully.</strong>
      <span>Open the browser console to view the output.</span>
    </div>

    <footer>
      <p>Student configuration: s9619 | Local port: 8619</p>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
