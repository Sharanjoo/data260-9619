services:
  mysql:
    image: mysql:8.0
    container_name: data260-hw4-mysql-s9619
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: hw4_root_pass_9619
      MYSQL_DATABASE: s9619_rel
      MYSQL_USER: hw4_user
      MYSQL_PASSWORD: hw4_pass_9619
    ports:
      - "43306:3306"  # 3306/3307/3308 are all already used by other projects on
                       # this machine; app still uses the internal Docker network
                       # (mysql:3306) regardless of this host-side mapping.
    volumes:
      - mysql_data_s9619:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-phw4_root_pass_9619"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  mongo:
    image: mongo:7.0
    container_name: data260-hw6-mongo-s9619
    restart: unless-stopped
    ports:
      - "27017:27017"  # if another MongoDB container already uses 27017, stop it first
    volumes:
      - mongo_data_s9619:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: code/Dockerfile
    image: data260-hw3-s9619:latest
    container_name: data260-hw3-s9619
    ports:
      - "8619:8619"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: hw4_user
      MYSQL_PASSWORD: hw4_pass_9619
      MYSQL_DB: s9619_rel
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB_NAME: s9619_doc
      OLLAMA_BASE_URL: http://host.docker.internal:11434   # Ollama runs on the laptop, not in Docker
      CHAT_MODEL: qwen3:8b
      EMBED_MODEL: nomic-embed-text
      SHORT_TERM_N: "12"
      SUMMARIZE_EVERY_USER_MSGS: "5"
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092   # HW8: reaches the broker over the Docker network
      PYTHONUNBUFFERED: "1"                  # HW8: log lines show up in `docker logs` immediately
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy

  # ---------------------------------------------------------------- HW8: Kafka request/response
  kafka:
    image: apache/kafka:3.9.2
    container_name: data260-hw8-kafka-s9619
    restart: unless-stopped
    ports:
      - "49092:49092"  # listener for scripts on the laptop (localhost:49092); 9092 is left free for other projects
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:49092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:49092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-init:
    image: apache/kafka:3.9.2
    container_name: data260-hw8-kafka-init-s9619
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        T=/opt/kafka/bin/kafka-topics.sh
        B=kafka:19092
        $$T --create --if-not-exists --topic s9619_entity_requests  --partitions 1 --replication-factor 1 --bootstrap-server $$B
        $$T --create --if-not-exists --topic s9619_entity_responses --partitions 1 --replication-factor 1 --bootstrap-server $$B
        $$T --create --if-not-exists --topic s9619_inbox --partitions 1 --replication-factor 1 --bootstrap-server $$B
        $$T --create --if-not-exists --topic s9619_tasks --partitions 2 --replication-factor 1 --bootstrap-server $$B
        $$T --create --if-not-exists --topic s9619_drafts --partitions 1 --replication-factor 1 --bootstrap-server $$B
        $$T --create --if-not-exists --topic s9619_final --partitions 1 --replication-factor 1 --bootstrap-server $$B
        $$T --create --if-not-exists --topic s9619_dead_letter --partitions 1 --replication-factor 1 --bootstrap-server $$B
        $$T --list --bootstrap-server $$B

  worker:
    build:
      context: .
      dockerfile: code/Dockerfile
    image: data260-hw3-s9619:latest   # the same image as web, started with a different command
    container_name: data260-hw8-worker-s9619
    restart: unless-stopped
    command: ["python", "-m", "kafka_api.worker"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      PYTHONUNBUFFERED: "1"
    healthcheck:
      test: ["CMD", "python", "-m", "kafka_api.healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  # ---------------------------------------------------------------- HW9: Redis (view counter + semantic cache)
  redis:
    image: redis/redis-stack-server:7.4.0-v3   # Redis with the RediSearch module (vector index); plain redis has none
    container_name: data260-hw9-redis-s9619
    restart: unless-stopped
    ports:
      - "46379:6379"  # scripts on the laptop use localhost:46379; 6379 is left free for other projects
    volumes:
      - redis_data_s9619:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  mysql_data_s9619:
  mongo_data_s9619:
  redis_data_s9619:
