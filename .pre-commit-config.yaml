# HW7 Part 1: lint staged Python files with Ruff on every `git commit`.
# One-time setup:   pip install pre-commit ruff   then   pre-commit install
# Run on everything: pre-commit run --all-files
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint)
        entry: ruff check
        language: system
        types: [python]
